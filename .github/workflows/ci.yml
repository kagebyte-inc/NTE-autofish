name: Build and Release

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-quick3d-dev \
            qt6-tools-dev \
            qt6-wayland-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            python3 \
            python3-pip

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Build
        run: cmake --build build --target autofish -j$(nproc)

      - name: Verify staged distribution
        run: |
          ls -l build/dist/
          test -x build/dist/autofish || { echo "Missing autofish binary"; exit 1; }
          test -f build/dist/python/autofish_vision/service.py || { echo "Missing vision service"; exit 1; }
          test -f build/dist/requirements.txt || { echo "Missing requirements.txt"; exit 1; }
          file build/dist/autofish
          echo "Project version (from CMake):"
          grep -E 'project\(autofish VERSION' CMakeLists.txt | cat
          echo "AUTOFISH_VERSION define present:"
          grep -E 'AUTOFISH_VERSION' CMakeLists.txt | cat
          echo "appVersion() implementation:"
          sed -n '/appVersion/,+5p' src/AppController.cpp | cat

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NTE-autofish-linux
          path: build/dist/
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download staged distribution
        uses: actions/download-artifact@v4
        with:
          name: NTE-autofish-linux
          path: dist

      - name: Package release tarball
        run: |
          tar -czvf NTE-autofish-${{ github.ref_name }}-linux-x86_64.tar.gz -C dist .
          ls -lh NTE-autofish-*.tar.gz
          echo "Tarball contents (top level):"
          tar -tzf NTE-autofish-${{ github.ref_name }}-linux-x86_64.tar.gz | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NTE-autofish-${{ github.ref_name }}-linux-x86_64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
